services:
  # Primary API / health / metrics entrypoint (task name: bot)
  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: bist-bot-api
    command:
      [
        "gunicorn",
        "--bind",
        "0.0.0.0:5000",
        "--workers",
        "1",
        "--threads",
        "8",
        "--timeout",
        "330",
        "--graceful-timeout",
        "30",
        "bist_bot.wsgi:app",
      ]
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONPATH: /app/src
      # settings.FLASK_PORT reads PORT first (Cloud Run convention)
      PORT: "5000"
      FLASK_PORT: "5000"
      FLASK_DEBUG: "False"
      API_BASE_URL: http://bot:5000
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://bist:bist@postgres:5432/bist_bot}
      DB_PATH: /app/data/bist_signals.db
      # C7: Prometheus ic agdan JWT'siz scrape icin (port host'a acilmadikca risk dusuk).
      METRICS_PUBLIC: ${METRICS_PUBLIC:-false}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set for secure startup}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      BROKER_MODE: ${BROKER_MODE:-paper}
      BROKER_PROVIDER: ${BROKER_PROVIDER:-paper}
      RBAC_MODE: ${RBAC_MODE:-enforce}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD_HASH: ${ADMIN_BOOTSTRAP_PASSWORD_HASH:-}
      DEGRADED_MAX_SECONDS: ${DEGRADED_MAX_SECONDS:-300}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      CONFIG_STRICT: ${CONFIG_STRICT:-true}
    ports:
      - "127.0.0.1:5000:5000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - bot-data:/app/data
      # RW zorunlu: API de /api/scan uzerinden outcome/shadow ledger'a yazar
      # (ScanService.process_scan -> results/*.json|csv). :ro (AppSec #121)
      # EOD pass'i deterministik patlatiyordu (outcome_close EROFS).
      - ./results:/app/results
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5000/livez || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # AppSec: kaynak siniri — gunicorn taramasi bellek patlamasinda host'u
    # dogurmamali (worker zaten 1g ile sinirli).
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped

  # Note: The legacy streamlit-ui service was retired in favor of the unified
  # Stitch UI served natively by the bot container at /ui/dashboard.

  scanner-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: bist-bot-worker
    command: ["python", "main.py", "--worker"]
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONPATH: /app/src
      API_BASE_URL: http://bot:5000
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://bist:bist@postgres:5432/bist_bot}
      DB_PATH: /app/data/bist_signals.db
      LOG_FORMAT: ${LOG_FORMAT:-json}
      BROKER_MODE: ${BROKER_MODE:-paper}
      BROKER_PROVIDER: ${BROKER_PROVIDER:-paper}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set for secure startup}
      # D1: MTF_ENABLED worker-only "false" kaldirildi (28.07 #108'de gerekcesiz
      # eklenmisti). Veri zaten her iki zaman diliminde cekiliyor; ayar yalnizca
      # motorun trend onayini kullanip kullanmadigini belirler — API/worker
      # ayni piyasa icin ayni sinyali uretmeli. Baseline: results/baseline_after_mtf.md
      # D3: hatali env degerleri uretimde fail-closed.
      CONFIG_STRICT: ${CONFIG_STRICT:-true}
    volumes:
      - bot-data:/app/data
      # RW zorunlu: EOD kapanis pass'i outcome/shadow ledger'a yazar
      # (SignalOutcomeTracker._write_json/_append_closed). :ro (AppSec #121)
      # yuzunden 09.09.2026'da 2/2 deneme EROFS ile patladi.
      - ./results:/app/results
    depends_on:
      bot:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      # C2: liveness = HTTP thread cevap veriyor (surec kill -0'dan daha anlamli;
      # readiness is sagligi /readyz uzerinden ayri izlenir, restart tetiklemez).
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:9101/healthz', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  postgres:
    # AppSec: tag -> digest pin (mutable tag riskini kapatir; Dockerfile
    # base'leri gibi). Digest = v2.54.1/16-alpine/11.2.0 tag'inin manifest
    # list'i; tag hareket ederse burasi sabit kalir.
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: bist-bot-postgres
    # AppSec #140: container sertleştirme (cap_drop postgres'un init
    # chown/setuid gereksinimleri yüzünden YALNIZCA worker/bot'ta uygulanır;
    # burada no-new-privileges + localhost-bind yeterli denge).
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bist}
      POSTGRES_DB: ${POSTGRES_DB:-bist_bot}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # AppSec: kaynak siniri — sorgu patlamasi host bellegini kemirmemeli.
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1@sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94
    container_name: bist-bot-prometheus
    # AppSec: prometheus root gerektirmez — tam cap_drop uygulanabilir.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    # AppSec: TSDB boyutu sinirli — disk dolumu monitor host'u bozmasin.
    deploy:
      resources:
        limits:
          memory: 512m
    depends_on:
      bot:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0@sha256:408afb9726de5122b00a2576763a8a57a3c86d5b0eff5305bc994ceb3eb96c3f
    container_name: bist-bot-grafana
    # AppSec: grafana uid-1000 olarak koşar — tam cap_drop uygulanabilir.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set — .env icinde tanimlayin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    # AppSec: sorgu/panel yuku bellek patlamasina donmesin.
    deploy:
      resources:
        limits:
          memory: 512m
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  bot-data:
  postgres-data:
  prometheus-data:
  grafana-data:
