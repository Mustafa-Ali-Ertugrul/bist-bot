apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: bist-bot-api
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
        autoscaling.knative.dev/maxScale: "1"
    spec:
      containerConcurrency: 20
      timeoutSeconds: 360
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/REPOSITORY/bist-bot:latest
          # Keep one process: /api/scan currently uses a process-local lock.
          command: ["gunicorn"]
          args:
            [
              "--bind",
              "0.0.0.0:8080",
              "--workers",
              "1",
              "--threads",
              "8",
              "--timeout",
              "330",
              "--graceful-timeout",
              "30",
              "--forwarded-allow-ips=*",
              "bist_bot.wsgi:app",
            ]
          env:
            - name: PORT
              value: "8080"
            - name: PYTHONPATH
              value: "/app/src"
            - name: DB_PATH
              value: "/tmp/bist_signals.db"
            # WARNING: Do not hardcode secret values in this file!
            # JWT_SECRET_KEY has no value here on purpose: a bare `name:` entry
            # without value/valueFrom is rejected by Cloud Run. Configure it via
            # Secret Manager, e.g.:
            # - name: JWT_SECRET_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: jwt-secret-key
            #       key: latest
            # For local development, set JWT_SECRET_KEY via environment variable or .env file
            - name: RATE_LIMIT_STORAGE_URI
              value: "memory://"
            - name: EXPECTED_INSTANCE_COUNT
              value: "1"
            - name: WATCHLIST_SOURCE
              value: "bist30"
            - name: CORS_ORIGINS
              value: "https://bist-bot-ui-REPLACE.a.run.app"
            # Admin bootstrap: set these to seed an initial admin user on first startup.
            # ADMIN_BOOTSTRAP_PASSWORD_HASH must be a pre-computed bcrypt or scrypt hash.
            # Generate with: python -c "from werkzeug.security import generate_password_hash; print(generate_password_hash('your_password', method='scrypt'))"
            # Or use Cloud Run Secret Manager for production secrets.
            # - name: ADMIN_BOOTSTRAP_EMAIL
            #   value: "admin@bistbot.com"
            # - name: ADMIN_BOOTSTRAP_PASSWORD_HASH
            #   value: "replace_with_scrypt_or_bcrypt_hash"
          ports:
            - name: http1
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /readyz
              port: 8080
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: 8080
            failureThreshold: 3
            periodSeconds: 30
