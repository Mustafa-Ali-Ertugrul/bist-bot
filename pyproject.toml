[project]
name = "bist_bot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.0",
    "bcrypt>=4.1.0",
    "beautifulsoup4>=4.12.0",
    "cryptography>=44.0.0",
    "defusedxml>=0.7.1",
    "exchange-calendars>=4.5.0",
    "flask>=3.0.0",
    "flask-cors>=5.0.0",
    "flask-jwt-extended>=4.6.0",
    "flask-limiter>=3.8.0",
    "gunicorn>=23.0.0",
    "holidays>=0.50",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "plotly>=5.18.0",
    "prometheus-client>=0.20.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "redis>=5.0.0",
    "requests>=2.32.3",
    "scikit-learn>=1.4.0",
    "sentry-sdk>=1.40.0",
    "sqlalchemy>=2.0.36",
    "streamlit>=1.30.0",
    "xgboost>=2.0.0",
    "yfinance>=0.2.40",
]

[dependency-groups]
dev = [
    "alembic>=1.13.0",
    "bandit[toml]>=1.7.10",
    "mypy>=1.5.0",
    "pip-audit>=2.7.3",
    "pytest>=9.0.0",
    "pytest-cov>=5.0.0",
    "ruff==0.12.10",
    "types-python-dateutil>=2.8.19",
    "types-requests>=2.31.0",
]

[tool.ruff]
src = ["src", "tests"]
exclude = ["get-pip.py"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "ARG",  # unused arguments
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line-too-long (line-length already enforced)
    "B008",   # function call in default arg (FastAPI/Flask pattern)
    "SIM108", # ternary instead of if-else (readability)
    "SIM102", # nested if (often clearer than combined)
    "SIM105", # contextlib.suppress (try/except is clearer here)
    "RUF001", # ambiguous unicode in string (Turkish content)
    "RUF002", # ambiguous unicode in docstring (Turkish content)
    "RUF003", # ambiguous unicode in comment (Turkish content)
    "RUF012", # mutable class attribute (dataclass default_factory exists)
    "RUF013", # implicit Optional (legacy code; gradual migration)
    "UP042",  # str-enum (StrEnum requires Python 3.11+ everywhere)
    "ARG002", # unused method argument (interface signatures)
    "B024",   # abstract base class without abstract methods
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "B011", "SIM"]
"scripts/**/*.py" = ["ARG"]
"debug_login.py" = ["E402", "I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: integration tests requiring external services",
]

[tool.coverage.run]
source = ["src/bist_bot"]
omit = [
    "*/tests/*",
    "*/__main__.py",
    "*/start_app.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests", "scripts"]
skips = ["B101"]  # assert_used (acceptable in tests)
