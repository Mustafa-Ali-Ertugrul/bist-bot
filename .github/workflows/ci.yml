name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONPATH: src

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            dev-requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r dev-requirements.txt

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy type check
        run: mypy src/bist_bot --ignore-missing-imports

      - name: Compile check
        run: python -m compileall src/bist_bot main.py dashboard.py streamlit_app.py

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            dev-requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r dev-requirements.txt

      - name: Run pytest with coverage
        run: |
          pytest tests/ -v --tb=short \
            --cov=src/bist_bot \
            --cov-report=xml \
            --cov-report=term-missing:skip-covered \
            --cov-fail-under=60

      - name: Upload coverage artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit[toml]

      - name: pip-audit (dependency CVE scan)
        run: |
          if [ -s .pip-audit-ignore ]; then
            pip-audit --requirement requirements.txt --strict --ignore-vuln-ignore-file=.pip-audit-ignore
          else
            pip-audit --requirement requirements.txt --strict
          fi

      - name: Bandit (static security analysis)
        run: bandit -r src/bist_bot -x tests -ll -f txt

      - name: Gitleaks (secret detection)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: false
          tags: bist-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Optional production deploy remains in deploy-cloud-run.yml (manual / post-CI).
  deploy:
    name: Deploy (optional gate)
    runs-on: ubuntu-latest
    needs: [docker]
    if: false
    steps:
      - run: echo "Enable via deploy-cloud-run.yml workflow_dispatch or workflow_run"
