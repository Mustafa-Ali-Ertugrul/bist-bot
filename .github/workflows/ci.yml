name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONPATH: src

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            uv.lock

      - name: Install dependencies
        run: |
          python -m pip install uv==0.11.16
          uv sync --locked --dev

      - name: Verify lock and generated requirements export
        run: |
          uv lock --check
          uv export --format requirements.txt --locked --no-dev --no-emit-project --output-file /tmp/requirements.lock.txt
          diff -u <(tail -n +3 requirements.lock.txt) <(tail -n +3 /tmp/requirements.lock.txt)
          diff -u <(tail -n +3 requirements.txt) <(tail -n +3 /tmp/requirements.lock.txt)

      - name: Ruff lint
        run: uv run --locked ruff check . --output-format=github

      - name: Ruff format check
        run: uv run --locked ruff format --check .

      - name: Mypy type check
        run: uv run --locked mypy src/bist_bot --ignore-missing-imports

      - name: Compile check
        run: uv run --locked python -m compileall src/bist_bot main.py dashboard.py streamlit_app.py

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            uv.lock

      - name: Install dependencies
        run: |
          python -m pip install uv==0.11.16
          uv sync --locked --dev

      - name: Run pytest with coverage
        run: |
          uv run --locked pytest tests/ -v --tb=short \
            --cov=src/bist_bot \
            --cov-report=xml \
            --cov-report=term-missing:skip-covered \
            --cov-fail-under=60

      - name: Upload coverage artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install security tools
        run: |
          python -m pip install uv==0.11.16
          uv sync --locked --dev

      - name: pip-audit (dependency CVE scan)
        run: |
          ARGS=""
          if [ -s .pip-audit-ignore ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              line="$(echo "$line" | sed 's/#.*//' | tr -d '[:space:]')"
              if [ -n "$line" ]; then
                ARGS="$ARGS --ignore-vuln $line"
              fi
            done < .pip-audit-ignore
          fi
          uv run --locked pip-audit --requirement requirements.lock.txt --require-hashes --strict $ARGS

      - name: Bandit (static security analysis)
        run: uv run --locked bandit -r src/bist_bot -x tests -ll -f txt

      - name: Bandit scripts (high-confidence medium+)
        run: uv run --locked bandit -r scripts -ll -ii -f txt

      - name: Gitleaks (secret detection)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: false
          tags: bist-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Optional production deploy remains in deploy-cloud-run.yml (manual / post-CI).
  deploy:
    name: Deploy (optional gate)
    runs-on: ubuntu-latest
    needs: [docker]
    if: false
    steps:
      - run: echo "Enable via deploy-cloud-run.yml workflow_dispatch or workflow_run"
