# Alembic migration environment for bist_bot
# Usage:
#   set DATABASE_URL=postgresql+psycopg2://user:pass@localhost:5432/bist_bot
#   alembic upgrade head
#   alembic revision --autogenerate -m "describe change"

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Intentionally empty: env.py resolves the URL at runtime from DATABASE_URL /
# BIST_BOT_DATABASE_URL / DB_PATH (a hardcoded value here would silently shadow
# the environment for every upgrade/check/downgrade invocation).
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
