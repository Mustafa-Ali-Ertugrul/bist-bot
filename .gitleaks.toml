[extend]
useDefault = true

[allowlist]
description = "Known test fixtures, placeholders, and dummy tokens"
paths = [
    '''tests/test_log_token_redaction\.py$''',
    '''tests/test_credential_redaction_audit\.py$''',
    '''\.env\.example$''',
    '''README\.md$''',
]
regexes = [
    '''test_secret_key_.*''',
    '''test[-_]secret[-_].*''',
    '''your_.*_here''',
    '''super_secret_jwt_key_.*''',
    '''secret_key_12345.*''',
    '''yanlis-sifre-123''',
    '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0''',
]
